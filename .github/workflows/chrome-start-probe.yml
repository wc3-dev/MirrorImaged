name: Chrome start probe

# Temporary: runs CI's own test step ten times in a row on the Linux runner, each from cold, and reads how long each start of the browser tests' Chrome took.
on:
  push:
    branches: [task/linux-browser]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MirrorImaged.slnx

      - name: Run the tests ten times
        shell: bash
        run: |
          export MIRROR_BROWSER_TIMES="$PWD/browser-times.txt"
          echo "caches before the first run: $(ls -A ~/.cache 2> /dev/null | xargs)"
          echo "home before the first run: $(ls -A ~ | xargs)"
          fonts_before=$( [ -d ~/.cache/fontconfig ] && echo yes || echo no )
          for i in $(seq 1 10); do
            # Each run starts cold, as on a fresh runner: nothing of Chrome's files in memory, and no font cache a run before made
            [ "$fonts_before" = no ] && rm -rf ~/.cache/fontconfig
            sync && echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
            dotnet test MirrorImaged.slnx --no-build --filter "Needs!=Game" > "test-$i.log" 2>&1
            echo "run $i: $(grep -hE 'Passed!|Failed!' "test-$i.log" | sed 's/ - MirrorImaged.*//' | tr '\n' ';') browser tests failed: $(grep -c 'ViewerBrowserTests.*\[FAIL\]' "test-$i.log")"
          done
          echo "caches after the runs: $(ls -A ~/.cache 2> /dev/null | xargs)"
          echo "home after the runs: $(ls -A ~ | xargs)"
          echo "home's folders made in the last hour: $(find ~ -maxdepth 3 -newer "$GITHUB_WORKSPACE/MirrorImaged.slnx" -type d 2> /dev/null | grep -v -e work -e /.nuget -e /.dotnet | head -30 | xargs)"
          echo "--- each start of the browser: ms, result, when its first line came, whether it printed the dbus line"
          cat "$MIRROR_BROWSER_TIMES"
          grep -E '^[0-9]+ (ok|fail) ' "$MIRROR_BROWSER_TIMES" | sort -n | awk '{ t[NR] = $1; if ($2 == "fail") f++ } END { printf "starts: %d; failed: %d; least %d ms, median %d ms, most %d ms; over 5 s: ", NR, f, t[1], t[int((NR + 1) / 2)], t[NR]; n = 0; for (i = 1; i <= NR; i++) if (t[i] > 5000) n++; print n }'
