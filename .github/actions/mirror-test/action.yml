name: Mirror test
description: Installs mirror and runs a map's Lua tests. Run it on a runner that has Warcraft III installed; MirrorImaged never downloads or ships game data.
inputs:
  tests:
    description: The Lua test file, or the folder whose *.test.lua files are run.
    default: tests
  junit:
    description: Where the JUnit XML of the results is written.
    default: mirror-junit.xml
  version:
    description: The version of the MirrorImaged.Cli tool to install; the latest when empty.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    # The inputs reach the shell as environment variables, not pasted into the script, so no value can run as a command
    - name: Install mirror
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.version }}
      run: dotnet tool install --global MirrorImaged.Cli ${TOOL_VERSION:+--version "$TOOL_VERSION"}
    - name: Run the tests
      shell: bash
      env:
        TESTS: ${{ inputs.tests }}
        JUNIT: ${{ inputs.junit }}
      run: mirror test "$TESTS" --junit "$JUNIT"
